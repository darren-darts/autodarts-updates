; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev            ; change to your specific board if different (e.g. esp32-s3-devkitc-1)
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Flash over WiFi once the board is running OTA-capable firmware:
;   pio run -e esp32ota -t upload
[env:esp32ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = led-controller.local
